services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/home/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/home/home.html:/usr/share/nginx/html/home.html:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcdougal_tools
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  ai-seo-pagescore:
    build:
      context: .
      dockerfile: docker/app-runner/node-replit.Dockerfile
      args:
        APP_DIR: apps/ai-seo-pagescore
    environment:
      NODE_ENV: production
      PORT: "5000"
    env_file:
      - env/global.env
    depends_on:
      - postgres
    ports:
      - "8101:5000"
    restart: unless-stopped

  asbestos-atlas:
