    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
    
    <!-- Embed height reporting script for iframe auto-resizing -->
    <script>
      (function () {
        function docHeight() {
          return Math.max(
            document.documentElement.scrollHeight,
            document.documentElement.offsetHeight,
            document.body ? document.body.scrollHeight : 0,
            document.body ? document.body.offsetHeight : 0
          );
        }
        function send() {
          window.parent.postMessage({ type: "EMBED_HEIGHT", height: docHeight() }, "*");
        }
        // fire often enough to catch dynamic results
        window.addEventListener("load", send);
        window.addEventListener("DOMContentLoaded", send);
        if ("ResizeObserver" in window) {
          new ResizeObserver(send).observe(document.body || document.documentElement);
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(send);
        setInterval(send, 800); // safety for async renders
      })();
    </script>
    
    <!-- iFrame Resizer -->
    <script src="https://cdn.jsdelivr.net/npm/iframe-resizer/js/iframeResizer.contentWindow.min.js"></script>
