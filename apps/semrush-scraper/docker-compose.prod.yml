version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: semrush-scraper-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: semrush_scraper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - semrush-network
    restart: always

  # Main Application (Production build)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: semrush-scraper-app-prod
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/semrush_scraper
      - PORT=5000
      # Load from .env file
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SEMRUSH_EMAIL=${SEMRUSH_EMAIL}
      - SEMRUSH_PASSWORD=${SEMRUSH_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      # Google Cloud Storage
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcs-credentials.json
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - GCS_PROJECT_ID=${GCS_PROJECT_ID}
      # Chrome/Puppeteer
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
    ports:
      - "5000:5000"
    volumes:
      - ./gcs-credentials.json:/app/gcs-credentials.json:ro
    networks:
      - semrush-network
    restart: always
    shm_size: 2gb
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

volumes:
  postgres_data_prod:
    driver: local

networks:
  semrush-network:
    driver: bridge
