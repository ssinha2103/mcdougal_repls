version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: semrush-scraper-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: semrush_scraper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - semrush-network

  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: semrush-scraper-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/semrush_scraper
      - PORT=5000
      # These will be loaded from .env file
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SEMRUSH_EMAIL=${SEMRUSH_EMAIL}
      - SEMRUSH_PASSWORD=${SEMRUSH_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      # Google Cloud Storage credentials
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcs-credentials.json
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - GCS_PROJECT_ID=${GCS_PROJECT_ID}
      # Chrome/Puppeteer settings
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome-stable
    ports:
      - "5000:5000"
    volumes:
      - ./:/app
      - /app/node_modules
      - ./gcs-credentials.json:/app/gcs-credentials.json:ro
    networks:
      - semrush-network
    restart: unless-stopped
    # Increase shared memory for Chrome
    shm_size: 2gb

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: semrush-scraper-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - semrush-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  semrush-network:
    driver: bridge
