services:
  gateway:
    ports: !reset []

  postgres:
    ports: !reset []

  caddy:
    image: caddy:2.8-alpine
    env_file:
      - env/global.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    networks:
      - default
      - algo-trader-notifier-ingress
    restart: unless-stopped

  ai-seo-pagescore:
    ports: !reset []

  asbestos-atlas:
    ports: !reset []

  btucalc:
    ports: !reset []

  dog-bite-map:
    ports: !reset []

  free-seo-tools-page:
    ports: !reset []

  header-hierarchy:
    ports: !reset []

  intent-discover:
    ports: !reset []

  keyword-mixer:
    ports: !reset []

  legal-lens:
    ports: !reset []

  legal-napaudit:
    ports: !reset []

  legal-revamp:
    ports: !reset []

  legal-schema-gen:
    ports: !reset []

  link-auditor:
    ports: !reset []

  mellino-health-data:
    ports: !reset []

  meta-describer:
    ports: !reset []

  ohio-care-finder:
    ports: !reset []

  ohio-maternity-monitor:
    ports: !reset []

  replit-downloader:
    ports: !reset []

  sales-research-flow:
    ports: !reset []

  semrush-scraper:
    ports: !reset []

  seo-headline-pro:
    ports: !reset []

  serpsnippet-audit:
    ports: !reset []

  text-clarity:
    ports: !reset []

  tube-insight:
    ports: !reset []

volumes:
  caddy_data:
  caddy_config:

networks:
  algo-trader-notifier-ingress:
    name: algo-trader-notifier-ingress
    external: true
