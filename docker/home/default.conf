map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  charset utf-8;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_read_timeout 120s;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # Use free-seo-tools-page as the default home UI.
  location = / {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://free-seo-tools-page:5000/;
  }

  location = /ai-seo-pagescore {
    return 302 $scheme://$host/ai-seo-pagescore/;
  }

  location ^~ /ai-seo-pagescore/ {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    rewrite ^/ai-seo-pagescore/(.*)$ /$1 break;
    proxy_pass http://ai-seo-pagescore:5000;
  }

  location = /asbestos-atlas {
    return 302 $scheme://$host/asbestos-atlas/;
  }

